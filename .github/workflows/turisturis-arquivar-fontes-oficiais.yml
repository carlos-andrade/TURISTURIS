name: TURISTURIS — Arquivar fontes oficiais Turismo de Portugal + DGAL

on:
  push:
    paths:
      - ".github/workflows/turisturis-arquivar-fontes-oficiais.yml"
      - "scripts/arquivar_fontes_oficiais.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turisturis-arquivo-fontes-oficiais
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 openpyxl odfpy

      - name: Download official public datasets
        run: python scripts/arquivar_fontes_oficiais.py

      - name: Persist archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "PESQUISA/FONTES/TURISMO_DE_PORTUGAL_DADOS_ABERTOS" "PESQUISA/FONTES/DGAL_PORTAL_AUTARQUICO"
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no arquivo."
            exit 0
          fi
          git commit -m "data: arquivar dados oficiais Turismo de Portugal e DGAL"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
