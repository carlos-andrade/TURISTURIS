name: TURISTURIS — Auditoria Integral da Normalização

on:
  push:
    paths:
      - 'CONTINENTE/DADOS/NORMALIZAÇÃO/**'
      - 'CONTINENTE/DADOS/CODIGOS/auditar_normalizacao.py'
      - '.github/workflows/turisturis-auditoria-normalizacao.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validar sintaxe Python
        run: python3 -m py_compile CONTINENTE/DADOS/CODIGOS/auditar_normalizacao.py
      - name: Executar auditoria
        run: python3 CONTINENTE/DADOS/CODIGOS/auditar_normalizacao.py
      - name: Publicar relatório
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTINENTE/DADOS/AUDITORIA_NORMALIZAÇÃO_V1.md
          git diff --cached --quiet || git commit -m "Adicionar relatório da auditoria da normalização"
          git push
