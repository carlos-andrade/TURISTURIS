name: TURISTURIS — Captura oficial RNET/RNAL

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturar:
    name: Capturar fichas oficiais e persistir evidência
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar dependências
        run: python3 -m pip install requests beautifulsoup4

      - name: Executar captura oficial
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/capturar_fichas_rnet_rnal.py > captura-rnet-rnal-result.json
          status=$?
          cat captura-rnet-rnal-result.json
          echo "capture_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Validar evidências e resultado
        id: validate
        if: always()
        shell: bash
        run: |
          test -f "FICHAS OFICIAIS RNET/6803/audit/manifest.json"
          test -f "FICHAS OFICIAIS RNAL/15642/audit/manifest.json"

          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("FICHAS OFICIAIS RNET/6803/audit/manifest.json"),
              Path("FICHAS OFICIAIS RNAL/15642/audit/manifest.json"),
          ]

          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("result") != "SUCCESS":
                  raise SystemExit(
                      f"EVIDÊNCIA OFICIAL INVÁLIDA: {path} -> {data.get('result')}"
                  )
              if data.get("http_status") != 200:
                  raise SystemExit(
                      f"FONTE OFICIAL NÃO CONFIRMADA: {path} -> HTTP {data.get('http_status')}"
                  )
              if not data.get("source_sha256"):
                  raise SystemExit(f"SHA-256 RAW AUSENTE: {path}")
              if not data.get("structured_sha256"):
                  raise SystemExit(f"SHA-256 STRUCTURED AUSENTE: {path}")

          print("VALIDAÇÃO OFICIAL: RNET 6803 e RNAL 15642 = SUCCESS / HTTP 200")
          PY

      - name: Persistir evidências no repositório
        if: steps.capture.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "FICHAS OFICIAIS RNET/6803" "FICHAS OFICIAIS RNAL/15642"
          if git diff --cached --quiet; then
            echo "Nenhuma nova evidência para persistir."
          else
            git commit -m "DATA: persistir evidência oficial RNET 6803 e RNAL 15642"
            git push
          fi

      - name: Publicar resultado da captura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TURISTURIS-CAPTURA-RNET-RNAL-RESULTADO
          path: |
            captura-rnet-rnal-result.json
            FICHAS OFICIAIS RNET/6803/audit/manifest.json
            FICHAS OFICIAIS RNAL/15642/audit/manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resultado final
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.capture.outcome }}" != "success" ]; then
            echo "CAPTURA OFICIAL FALHOU."
            exit 1
          fi
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "VALIDAÇÃO DAS EVIDÊNCIAS OFICIAIS FALHOU."
            exit 1
          fi
          echo "CAPTURA E VALIDAÇÃO OFICIAL CONCLUÍDAS COM SUCESSO."
