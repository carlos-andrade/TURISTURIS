name: TURISTURIS — Captura em lote RNAL Tomar

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/descobrir_rnal_tomar.py"
      - ".github/workflows/turisturis-captura-rnal-tomar.yml"

permissions:
  contents: write

concurrency:
  group: turisturis-rnal-tomar-lote
  cancel-in-progress: false

jobs:
  captura-rnal:
    name: Descobrir e capturar todas as fichas RNAL de Tomar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar dependências
        run: python3 -m pip install requests beautifulsoup4

      - name: Descobrir universo oficial RNAL
        run: python3 scripts/descobrir_rnal_tomar.py

      - name: Capturar fichas oficiais
        id: capture
        continue-on-error: true
        run: |
          set +e
          python3 - <<'PY' > rnal-tomar-result.json
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from capturar_fichas_rnet_rnal import capture

          index = json.loads(Path("DADOS/INDICES/rnal_tomar.json").read_text(encoding="utf-8"))
          results, failures = [], []
          for row in index["records"]:
              number = str(row["NrRNAL"])
              url = f"https://rnt.turismodeportugal.pt/RNT/RNAL.aspx?nr={number}"
              try:
                  results.append(capture("RNAL", url))
              except Exception as exc:
                  failures.append({"registry_number": number, "error": str(exc)})

          report = {
              "source_index_count": len(index["records"]),
              "captured_successfully": len(results),
              "failures": failures,
              "result": "SUCCESS" if len(results) == len(index["records"]) and not failures else "FAILED"
          }
          Path("DADOS/INDICES/rnal_tomar_capture_report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          raise SystemExit(0 if report["result"] == "SUCCESS" else 1)
          PY
          status=$?
          cat rnal-tomar-result.json
          echo "capture_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Validar cobertura
        id: validate
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path("DADOS/INDICES/rnal_tomar.json").read_text(encoding="utf-8"))
          report = json.loads(Path("DADOS/INDICES/rnal_tomar_capture_report.json").read_text(encoding="utf-8"))
          expected = index["count"]
          success = report["captured_successfully"]
          failures = report["failures"]
          if expected != success or failures or report["result"] != "SUCCESS":
              raise SystemExit(f"COBERTURA INCOMPLETA: esperado={expected}, sucesso={success}, falhas={len(failures)}")
          print(f"VALIDAÇÃO: {success}/{expected} fichas RNAL capturadas com sucesso.")
          PY

      - name: Persistir evidências
        if: steps.capture.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "FICHAS OFICIAIS RNAL" "DADOS/INDICES/rnal_tomar.json" "DADOS/INDICES/rnal_tomar.csv" "DADOS/INDICES/rnal_tomar_capture_report.json"
          if git diff --cached --quiet; then
            echo "Nenhuma nova evidência para persistir."
          else
            git commit -m "DATA: capturar fichas oficiais RNAL de Tomar"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Publicar resultado
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: TURISTURIS-RNAL-TOMAR-RESULTADO
          path: |
            rnal-tomar-result.json
            DADOS/INDICES/rnal_tomar.json
            DADOS/INDICES/rnal_tomar.csv
            DADOS/INDICES/rnal_tomar_capture_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resultado final
        if: always()
        run: |
          if [ "${{ steps.capture.outcome }}" != "success" ]; then exit 1; fi
          if [ "${{ steps.validate.outcome }}" != "success" ]; then exit 1; fi
          echo "CAPTURA EM LOTE E VALIDAÇÃO CONCLUÍDAS COM SUCESSO."
