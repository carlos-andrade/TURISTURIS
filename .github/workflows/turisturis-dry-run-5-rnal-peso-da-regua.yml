name: TURISTURIS — DRY-RUN controlado 5 RNAL Peso da Régua

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dry-run:
    name: Validar 5 RNAL de referência
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Recuperar normalização WEB-12.2
        uses: actions/download-artifact@v5
        with:
          name: TURISTURIS-WEB-12.2-NORMALIZADO
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: "37403480142"
          path: .

      - name: Extrair normalização
        run: tar -xzf alojamentos-normalizados-web-12-2.tar.gz

      - name: Executar DRY-RUN dos 5 RNAL conhecidos
        env:
          RNAL_MUNICIPIO: "Peso da Régua"
          RNAL_IDS: "17559,44840,47088,51840,52897"
          RNAL_LIMIT: "50"
          RNAL_WORKERS: "4"
        run: python3 CONTINENTE/DADOS/CODIGOS/enriquecimento_contatos_rnal_v1.py

      - name: Gate técnico
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/RNAL_CONTACTOS_PUBLICOS_V1.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["municipio"] == "Peso da Régua"
          assert d["target_total"] == 5, d["target_total"]
          assert d["record_count"] == 5, d["record_count"]
          assert d["status_counts"].get("CONTACTOS_GENERICOS_FONTE", 0) == 0, d["status_counts"]
          assert d["status_counts"].get("ERRO_HTTP", 0) == 0, d["status_counts"]
          assert d["status_counts"].get("ERRO_REDE", 0) == 0, d["status_counts"]
          print("GATE DRY-RUN OK:", json.dumps(d["status_counts"], ensure_ascii=False))
          PY
