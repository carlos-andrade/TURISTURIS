name: TURISTURIS — Gerar tabela-mestra RNAL Peso da Régua

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turisturis-rnal-master-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gerar tabela-mestra
        run: python3 scripts/gerar_tabela_mestra_rnal_peso_da_regua.py

      - name: Validar contagem
        run: |
          python3 - <<'PY'
          import json
          p="DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.json"
          r=json.load(open(p,encoding="utf-8"))
          assert r["expected_count"] == 182
          assert r["output_count"] == 182
          print(r)
          PY

      - name: Persistir tabela
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.csv DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.json
          git commit -m "DATA: gerar tabela-mestra RNAL Peso da Régua" || exit 0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 3; fi
          done
          echo "PUSH_STATUS=FALHA_APOS_5_TENTATIVAS"
          exit 1
