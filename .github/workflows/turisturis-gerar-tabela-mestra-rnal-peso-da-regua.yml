name: TURISTURIS — Gerar tabela-mestra RNAL Peso da Régua

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gerar tabela-mestra
        run: python3 scripts/gerar_tabela_mestra_rnal_peso_da_regua.py

      - name: Validar contagem
        run: |
          python3 - <<'PY'
          import json
          p="DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.json"
          r=json.load(open(p,encoding="utf-8"))
          assert r["expected_count"] == 182
          assert r["output_count"] == 182
          print(r)
          PY

      - name: Persistir tabela
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.csv DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.json
          git commit -m "DATA: gerar tabela-mestra RNAL Peso da Régua"
          git push
