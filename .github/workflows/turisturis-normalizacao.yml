name: TURISTURIS — Normalização Sequencial Automática

on:
  push:
    paths:
      - 'CONTINENTE/DADOS/CODIGOS/**'
      - 'CONTINENTE/DISTRITO/**'
      - '.github/workflows/turisturis-normalizacao.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Executar normalização sequencial
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RUN_DATE: ${{ github.run_started_at }}
        run: python3 CONTINENTE/DADOS/CODIGOS/normalizar_pontos_turisticos.py
