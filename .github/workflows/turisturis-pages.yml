name: TURISTURIS — Publicação GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - ".github/workflows/turisturis-pages.yml"
      - "CONTINENTE/DADOS/NORMALIZAÇÃO/**"
      - "CONTINENTE/DADOS/CODIGOS/gerar_publicacao_pontos_turisticos.py"
      - "CONTINENTE/DADOS/CODIGOS/gerar_publicacao_alojamentos.py"
      - "CONTINENTE/DADOS/CODIGOS/normalizacao_alojamentos_nacional_v1.py"
      - "CONTINENTE/DADOS/VALIDAÇÃO/ALOJAMENTOS/**"
      - "CONTINENTE/DADOS/PUBLICACAO/ALOJAMENTOS_PUBLICAVEIS_V2.json"
      - "CONTINENTE/DADOS/CODIGOS/enriquecimento_contatos_rnal_v1.py"
      - "CONTINENTE/DADOS/PUBLICACAO/RNAL_PESO_DA_REGUA_PUBLICAVEIS_V1.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Preparar site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Recuperar normalização validada WEB-12.2
        uses: actions/download-artifact@v5
        with:
          name: TURISTURIS-WEB-12.2-NORMALIZADO
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37403480142
          path: .

      - name: Extrair normalização validada
        run: tar -xzf alojamentos-normalizados-web-12-2.tar.gz

      - name: Recuperar enriquecimento WEB-12.6
        uses: actions/download-artifact@v5
        with:
          name: TURISTURIS-WEB-12.6-RNAL-CONTACTOS
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37404716998
          path: .

      - name: Extrair enriquecimento WEB-12.6
        run: tar -xzf rnal-contactos-publicos-web-12-6.tar.gz

      - name: Preparar diretório de publicação
        run: |
          rm -rf _site
          mkdir -p _site/CONTINENTE/DADOS/PUBLICACAO
          cp index.html _site/index.html
          python3 CONTINENTE/DADOS/CODIGOS/gerar_publicacao_pontos_turisticos.py
          cp CONTINENTE/DADOS/PUBLICACAO/PONTOS_TURISTICOS_PUBLICAVEIS_COMPLETO_V1.json _site/CONTINENTE/DADOS/PUBLICACAO/
          cp CONTINENTE/DADOS/PUBLICACAO/CATALOGO_MUNICIPIOS_NORMALIZADOS_V1.json _site/CONTINENTE/DADOS/PUBLICACAO/
          cp CONTINENTE/DADOS/PUBLICACAO/AMADORA_PONTOS_TURISTICOS_V1.json _site/CONTINENTE/DADOS/PUBLICACAO/
          python3 CONTINENTE/DADOS/CODIGOS/gerar_publicacao_alojamentos.py
          cp CONTINENTE/DADOS/PUBLICACAO/ALOJAMENTOS_PUBLICAVEIS_V2.json _site/CONTINENTE/DADOS/PUBLICACAO/
          cp CONTINENTE/DADOS/PUBLICACAO/RNAL_PESO_DA_REGUA_PUBLICAVEIS_V1.json _site/CONTINENTE/DADOS/PUBLICACAO/

      - name: Upload do artefato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
