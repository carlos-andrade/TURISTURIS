name: TURISTURIS — Publicação GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - ".github/workflows/turisturis-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Preparar site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preparar diretório de publicação
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload do artefato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
