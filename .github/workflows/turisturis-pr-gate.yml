name: TURISTURIS — PR Gate de Integração

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate de Integração
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar sintaxe do normalizador
        run: python3 -m py_compile CONTINENTE/DADOS/CODIGOS/normalizar_pontos_turisticos.py

      - name: Validar sintaxe do auditor
        run: python3 -m py_compile CONTINENTE/DADOS/CODIGOS/auditar_normalizacao.py

      - name: Executar auditoria estrutural em modo somente leitura
        run: python3 CONTINENTE/DADOS/CODIGOS/auditar_normalizacao.py --check

      - name: Confirmar workspace somente leitura
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "PR Gate aprovado: validação não produziu alterações no workspace."
          else
            echo "ERRO: a validação produziu alterações inesperadas no workspace."
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Gate final
        run: echo "PR Gate de Integração — APROVADO"
