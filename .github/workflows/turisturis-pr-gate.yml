name: TURISTURIS — PR Gate de Integração

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate de Integração
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validar sintaxe do normalizador sem gerar artefatos
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('CONTINENTE/DADOS/CODIGOS/normalizar_pontos_turisticos.py').read_text(encoding='utf-8'))"

      - name: Validar sintaxe do auditor sem gerar artefatos
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('CONTINENTE/DADOS/CODIGOS/auditar_normalizacao.py').read_text(encoding='utf-8'))"

      - name: Executar auditoria estrutural em modo somente leitura
        run: python3 CONTINENTE/DADOS/CODIGOS/auditar_normalizacao.py --check

      - name: Confirmar workspace somente leitura
        run: |
          echo "Estado do workspace após a auditoria:"
          git status --short
          echo
          echo "Alterações não staged:"
          git diff --name-status
          echo
          echo "Alterações staged:"
          git diff --cached --name-status

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "PR Gate aprovado: validação não produziu alterações no workspace."
          else
            echo "ERRO: a validação produziu alterações inesperadas no workspace."
            exit 1
          fi

      - name: Gate final
        run: echo "PR Gate de Integração — APROVADO"
