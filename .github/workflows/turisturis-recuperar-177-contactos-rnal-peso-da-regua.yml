name: TURISTURIS — Consolidar contactos RNAL Peso da Régua a partir das fichas oficiais

on:
  push:
    paths:
      - ".github/workflows/turisturis-recuperar-177-contactos-rnal-peso-da-regua.yml"
      - "CONTINENTE/DADOS/CODIGOS/extrair_contactos_fichas_rnal_v2.py"
      - "DADOS/CONTACTOS/contactos_existentes_peso_da_regua.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turisturis-consolidar-contactos-peso-da-regua
  cancel-in-progress: false

jobs:
  consolidar:
    name: Consolidar 182 RNAL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Extrair contactos das fichas oficiais
        run: python3 CONTINENTE/DADOS/CODIGOS/extrair_contactos_fichas_rnal_v2.py

      - name: Gate — 182 fichas e contactos válidos
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/RNAL_CONTACTOS_FICHAS_OFICIAIS_V2.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["rnal_total"] == 182, d["rnal_total"]
          c=d["status_counts"]
          assert c.get("ERRO_JSON",0) == 0, c
          assert c.get("SEM_FICHA_LOCAL",0) == 0, c
          assert c.get("CONFIRMADO_FICHA_OFICIAL",0) == 182, c
          print("GATE OK:", json.dumps(c, ensure_ascii=False))
          PY

      - name: Consolidar sem apagar contactos existentes
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          table=Path("DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.csv")
          existing=Path("DADOS/CONTACTOS/contactos_existentes_peso_da_regua.csv")
          source=Path("CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/RNAL_CONTACTOS_FICHAS_OFICIAIS_V2.json")

          rows=list(csv.DictReader(table.open(encoding="utf-8-sig",newline="")))
          old=list(csv.DictReader(existing.open(encoding="utf-8-sig",newline=""))) if existing.exists() else []
          src=json.loads(source.read_text(encoding="utf-8"))["records"]

          by_rnal={str(r.get("NrRNAL","")).strip():r for r in rows}
          official={str(r.get("NrRNAL","")).strip():r for r in src}
          preserved={str(r.get("NrRNAL","")).strip():r for r in old if r.get("NrRNAL")}

          existing_rows=0
          official_rows=0
          fields_added=0

          for rnal,row in by_rnal.items():
              oldr=preserved.get(rnal)
              rec=official.get(rnal)

              if oldr:
                  existing_rows += 1
                  for k in ("Telefone","Email","Website","OutrosContactos","FonteContacto"):
                      if oldr.get(k):
                          if not row.get(k):
                              fields_added += 1
                          row[k]=oldr[k]

              if rec and rec.get("status")=="CONFIRMADO_FICHA_OFICIAL":
                  official_rows += 1
                  phones="; ".join(rec.get("telefone") or [])
                  emails="; ".join(rec.get("email") or [])

                  if phones and not row.get("Telefone"):
                      row["Telefone"]=phones
                      fields_added += 1
                  if emails and not row.get("Email"):
                      row["Email"]=emails
                      fields_added += 1

                  if oldr:
                      if not row.get("FonteContacto"):
                          row["FonteContacto"]="FICHA OFICIAL RNAL "+rnal
                  else:
                      row["FonteContacto"]="FICHA OFICIAL RNAL "+rnal
                      row["EstadoContacto"]="CONFIRMADO_FICHA_OFICIAL"

              if not row.get("EstadoContacto"):
                  row["EstadoContacto"]="PENDENTE_RECUPERACAO"

          with table.open("w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys()))
              w.writeheader(); w.writerows(rows)

          states={}
          for r in rows:
              s=r.get("EstadoContacto","")
              states[s]=states.get(s,0)+1

          report={
              "result":"SUCCESS",
              "rnal_total":len(rows),
              "fichas_oficiais_confirmadas":official_rows,
              "contactos_existentes_preservados":existing_rows,
              "campos_adicionados":fields_added,
              "pendentes":sum(v for k,v in states.items() if k=="PENDENTE_RECUPERACAO"),
              "estados":states,
              "source":"FICHAS OFICIAIS RNAL capturadas",
              "process":"WEB-12.7"
          }
          Path("DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          PY

      - name: Gate final — integridade 182/182 e zero pendentes
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          table=list(csv.DictReader(Path("DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.csv").open(encoding="utf-8")))
          report=json.loads(Path("DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.json").read_text(encoding="utf-8"))
          assert len(table)==182, len(table)
          assert report["fichas_oficiais_confirmadas"]==182, report
          assert report["contactos_existentes_preservados"]==5, report
          assert report["pendentes"]==0, report
          assert all(r.get("Telefone") or r.get("Email") for r in table), "Há RNAL sem telefone/email"
          print("GATE FINAL OK: 182/182 com contacto; 5 fontes existentes preservadas")
          PY

      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.csv DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.json
          git diff --cached --quiet || git commit -m "feat: consolidar contactos RNAL a partir das fichas oficiais"
          git push
