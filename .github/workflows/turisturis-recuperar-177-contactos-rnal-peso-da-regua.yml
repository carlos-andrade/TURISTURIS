name: TURISTURIS — Recuperar 177 contactos RNAL Peso da Régua

on:
  push:
    paths:
      - ".github/workflows/turisturis-recuperar-177-contactos-rnal-peso-da-regua.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: turisturis-recuperar-contactos-peso-da-regua
  cancel-in-progress: false

env:
  NORMALIZATION_RUN_ID: "37403480142"
  RNAL_LIMIT: "50"
  RNAL_WORKERS: "4"

jobs:
  enriquecer:
    name: Lote RNAL ${{ matrix.offset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 50, 100, 150]
    steps:
      - uses: actions/checkout@v5
      - name: Recuperar normalização WEB-12.2
        uses: actions/download-artifact@v5
        with:
          name: TURISTURIS-WEB-12.2-NORMALIZADO
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.NORMALIZATION_RUN_ID }}
          path: .
      - name: Extrair normalização
        run: tar -xzf alojamentos-normalizados-web-12-2.tar.gz
      - name: Recolher contactos
        env:
          RNAL_OFFSET: ${{ matrix.offset }}
          RNAL_LIMIT: ${{ env.RNAL_LIMIT }}
          RNAL_WORKERS: ${{ env.RNAL_WORKERS }}
        run: python3 CONTINENTE/DADOS/CODIGOS/enriquecimento_contatos_rnal_v1.py
      - name: Validar lote
        env:
          OFFSET: ${{ matrix.offset }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/RNAL_CONTACTOS_PUBLICOS_V1.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["record_count"] > 0
          assert d["offset"] == int(os.environ["OFFSET"])
          print({"offset":d["offset"],"records":d["record_count"],
                 "statuses":sorted({r["status"] for r in d["records"]})})
          PY
      - name: Publicar lote
        uses: actions/upload-artifact@v4
        with:
          name: RNAL-CONTACTOS-PESO-DA-REGUA-${{ matrix.offset }}
          path: CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/RNAL_CONTACTOS_PUBLICOS_V1.json
          retention-days: 30

  consolidar:
    name: Consolidar 182 RNAL e preservar contactos existentes
    needs: enriquecer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Baixar lotes
        uses: actions/download-artifact@v5
        with:
          pattern: RNAL-CONTACTOS-PESO-DA-REGUA-*
          path: lotes
          merge-multiple: false
      - name: Consolidar e atualizar tabela-mestra
        run: |
          python3 - <<'PY'
          import csv, json, glob
          from pathlib import Path
          table=Path("DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.csv")
          existing=Path("DADOS/CONTACTOS/contactos_existentes_peso_da_regua.csv")
          rows=list(csv.DictReader(table.open(encoding="utf-8-sig", newline="")))
          old=list(csv.DictReader(existing.open(encoding="utf-8-sig", newline=""))) if existing.exists() else []
          by_rnal={str(r.get("NrRNAL","")).strip():r for r in rows}
          preserved={str(r.get("NrRNAL","")).strip():r for r in old if r.get("NrRNAL")}
          found={}
          for p in glob.glob("lotes/*/RNAL_CONTACTOS_PUBLICOS_V1.json"):
              d=json.loads(Path(p).read_text(encoding="utf-8"))
              for r in d["records"]:
                  sid=str(r.get("id_origem","")).strip()
                  if sid: found[sid]=r
          for rnal,row in by_rnal.items():
              oldr=preserved.get(rnal)
              rec=found.get(rnal)
              if oldr:
                  for k in ("Telefone","Email","Website","OutrosContactos","FonteContacto"):
                      if oldr.get(k): row[k]=oldr[k]
                  row["EstadoContacto"]=oldr.get("EstadoContacto") or "PRESERVADO_FONTE_EXISTENTE"
                  continue
              if rec:
                  phones="; ".join(rec.get("telefone") or [])
                  emails="; ".join(rec.get("email") or [])
                  if phones: row["Telefone"]=phones
                  if emails: row["Email"]=emails
                  row["FonteContacto"]=rec.get("ficha_oficial","")
                  row["EstadoContacto"]="CONFIRMADO_RNAL_PUBLICO" if (phones or emails) else rec.get("status","SEM_CONTACTOS")
              else: row["EstadoContacto"]="PENDENTE_RECUPERACAO"
          fields=list(rows[0].keys()) if rows else []
          with table.open("w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          report={
            "result":"SUCCESS","rnal_total":len(rows),"lotes_consolidados":4,
            "contactos_existentes_preservados":sum(1 for r in rows if r.get("EstadoContacto","").startswith("PRESERVADO")),
            "contactos_confirmados_rnal_publico":sum(1 for r in rows if r.get("EstadoContacto")=="CONFIRMADO_RNAL_PUBLICO"),
            "sem_contactos":sum(1 for r in rows if r.get("EstadoContacto") in ("SEM_CONTACTOS","PAGINA_SEM_BLOCO_CONTACTOS")),
            "erros":sum(1 for r in rows if r.get("EstadoContacto") in ("ERRO_HTTP","ERRO_REDE")),
            "pendentes":sum(1 for r in rows if r.get("EstadoContacto")=="PENDENTE_RECUPERACAO")}
          Path("DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Verificar integridade
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path("DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.csv").open(encoding="utf-8")))
          assert len(rows)==182, len(rows)
          print("INTEGRIDADE OK: 182/182")
          PY
      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.csv DADOS/TABELAS/rnal_peso_da_regua_tabela_mestra.json
          git diff --cached --quiet || git commit -m "feat: recuperar contactos RNAL Peso da Régua"
          git push
