name: TURISTURIS — WEB-12.6 enriquecimento de contactos RNAL
on:
  workflow_dispatch:
    inputs:
      normalization_run_id:
        description: "Run ID do WEB-12.2 que contém o artefato normalizado"
        required: true
        type: string
      rnal_offset:
        description: "Offset inicial no snapshot RNAL"
        required: true
        default: "0"
        type: string
      rnal_limit:
        description: "Quantidade de registos do lote"
        required: true
        default: "50"
        type: string
      rnal_workers:
        description: "Concorrência máxima"
        required: true
        default: "4"
        type: string
      rnal_municipio:
        description: "Município alvo do lote RNAL"
        required: true
        default: "Peso da Régua"
        type: string
permissions:
  contents: write
jobs:
  enriquecer:
    name: Recolher contactos públicos RNAL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RNAL_OFFSET: ${{ inputs.rnal_offset }}
      RNAL_LIMIT: ${{ inputs.rnal_limit }}
      RNAL_WORKERS: ${{ inputs.rnal_workers }}
      RNAL_MUNICIPIO: ${{ inputs.rnal_municipio }}
      NORMALIZATION_RUN_ID: ${{ inputs.normalization_run_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Validar parâmetros
        run: |
          python3 - <<'PY'
          import os
          run_id = os.environ["NORMALIZATION_RUN_ID"]
          offset = int(os.environ["RNAL_OFFSET"])
          limit = int(os.environ["RNAL_LIMIT"])
          workers = int(os.environ["RNAL_WORKERS"])
          assert run_id.isdigit() and int(run_id) > 0, "normalization_run_id inválido"
          assert offset >= 0, "RNAL_OFFSET inválido"
          assert 1 <= limit <= 500, "RNAL_LIMIT deve estar entre 1 e 500"
          municipio = os.environ.get("RNAL_MUNICIPIO", "").strip()
          assert municipio.casefold() == "peso da régua", "RNAL_MUNICIPIO deve ser Peso da Régua"
          assert 1 <= workers <= 4, "RNAL_WORKERS deve estar entre 1 e 4"
          print({"normalization_run_id": run_id, "offset": offset, "limit": limit, "workers": workers})
          PY
      - name: Recuperar normalização WEB-12.2
        uses: actions/download-artifact@v5
        with:
          name: TURISTURIS-WEB-12.2-NORMALIZADO
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.normalization_run_id }}
          path: .
      - name: Extrair normalização
        run: tar -xzf alojamentos-normalizados-web-12-2.tar.gz
      - name: Recolher contactos públicos
        run: python3 CONTINENTE/DADOS/CODIGOS/enriquecimento_contatos_rnal_v1.py
      - name: Validar saída
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/RNAL_CONTACTOS_PUBLICOS_V1.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["municipio"] == "Peso da Régua", "município de saída inválido"
          assert d["target_total"] == 182, f"universo inválido: {d['target_total']}"
          assert d["offset"] == int(os.environ["RNAL_OFFSET"]), "offset divergente"
          assert 0 < d["record_count"] <= int(os.environ["RNAL_LIMIT"])
          assert all("id" in r and "id_origem" in r and "status" in r for r in d["records"])
          ids=[r["id_origem"] for r in d["records"]]
          assert len(ids) == len(set(ids)), "id_origem duplicado no lote"
          print(json.dumps({
            "municipio": d["municipio"], "target_total": d["target_total"], "offset": d["offset"], "limit": d["limit"],
            "records": d["record_count"],
            "statuses": sorted(set(r["status"] for r in d["records"]))
          }, ensure_ascii=False))
          PY
      - name: Persistir lote no repositório
        run: |
          mkdir -p CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/LOTES
          cp CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/RNAL_CONTACTOS_PUBLICOS_V1.json \
            "CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/LOTES/rnal_contactos_offset_${RNAL_OFFSET}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/LOTES
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova para persistir."
          else
            git commit -m "DATA: persistir lote WEB-12.6 RNAL offset ${RNAL_OFFSET}"
            git push
          fi
      - name: Compactar resultado
        run: tar -czf rnal-contactos-publicos-web-12-6.tar.gz CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/RNAL_CONTACTOS_PUBLICOS_V1.json
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: TURISTURIS-WEB-12.6-RNAL-CONTACTOS-${{ inputs.rnal_offset }}
          path: rnal-contactos-publicos-web-12-6.tar.gz
          retention-days: 30
