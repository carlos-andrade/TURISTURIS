name: TURISTURIS — WEB-12.6 orquestrador nacional RNAL
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/turisturis-web-12-6-enriquecimento-nacional.yml"
      - ".github/workflows/turisturis-web-12-6-orquestrador-nacional.yml"
      - ".github/workflows/turisturis-web-12-6-consolidacao-nacional.yml"
      - "DADOS/INDICES/rnal_municipios_catalogo.json"
      - "DADOS/INDICES/rnal_nacional_consolidacao.json"
permissions:
  contents: write
  actions: write
concurrency:
  group: turisturis-web-12-6-orquestrador-nacional
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Selecionar próximo lote somente após evidência
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: turisturis-web-12-6-enriquecimento-nacional.yml
          CATALOG: turisturis-web-12-6-catalogo-municipios.yml
          NORMALIZATION: turisturis-web-12-2-normalizacao.yml
        run: |
          set -euo pipefail
          if gh run list --repo "$REPO" --workflow "$TARGET" --limit 20 --json status --jq 'any(.[]; .status == "queued" or .status == "in_progress")' | grep -q true; then
            echo "Execução nacional já em curso."; exit 0
          fi
          if [ ! -f DADOS/INDICES/rnal_municipios_catalogo.json ]; then
            echo "Catálogo nacional ausente; disparando geração controlada."
            gh workflow run "$CATALOG" --repo "$REPO" --ref main -f normalization_run_id="37402864529"
            exit 0
          fi

          if find CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/LOTES -type f -name 'rnal_contactos_offset_*.json' -print -quit | grep -q .; then
            python3 CONTINENTE/DADOS/CODIGOS/consolidar_contactos_rnal_nacional_v1.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add DADOS/INDICES/rnal_nacional_consolidacao.json
            if ! git diff --cached --quiet; then
              git commit -m "DATA: atualizar evidência nacional WEB-12.6"
              git push
            fi
          fi
          next_municipio=""
          next_offset=""
          while IFS=$'\t' read -r municipio slug total; do
            [ -n "$municipio" ] || continue
            offset=0
            while [ "$offset" -lt "$total" ]; do
              file="CONTINENTE/DADOS/ENRIQUECIMENTO/ALOJAMENTOS/LOTES/$slug/rnal_contactos_offset_${offset}.json"
              if [ ! -f "$file" ]; then
                if [ -f DADOS/INDICES/rnal_nacional_consolidacao.json ]; then
                  python3 - "$municipio" <<'PY'
          import json,sys
          c=json.load(open("DADOS/INDICES/rnal_nacional_consolidacao.json",encoding="utf-8"))
          m=next(x for x in c["municipios"] if x["municipio"].casefold()==sys.argv[1].casefold())
          if m["erros"]:
              raise SystemExit("evidência contém erros para o município alvo")
          PY
                fi
                next_municipio="$municipio"; next_offset="$offset"; break 2
              fi
              offset=$((offset+50))
            done
          done < <(python3 -c 'import json; c=json.load(open("DADOS/INDICES/rnal_municipios_catalogo.json",encoding="utf-8")); [print(x["municipio"],x["slug"],x["target_total"],sep="\t") for x in c["municipios"]]')
          if [ -z "$next_municipio" ]; then echo "Todos os lotes catalogados estão persistidos."; exit 0; fi
          run_id="$(gh run list --repo "$REPO" --workflow "$NORMALIZATION" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" && test "$run_id" != "null"
          echo "Próximo lote: município=$next_municipio offset=$next_offset normalization=$run_id"
          gh workflow run "$TARGET" --repo "$REPO" --ref main -f normalization_run_id="$run_id" -f rnal_municipio="$next_municipio" -f rnal_offset="$next_offset" -f rnal_limit="50" -f rnal_workers="4"
